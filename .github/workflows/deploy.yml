name: Deploy Demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép kích hoạt chạy thủ công từ tab Actions trên GitHub

# Cấp quyền ghi để GitHub Actions có thể deploy lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ cho phép 1 luồng deploy chạy đồng thời để tránh xung đột
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt dependencies và Build Thư viện Icon (Root)
        run: |
          npm ci
          npm run build

      - name: Cài đặt dependencies và Build Demo
        run: |
          cd demo
          npm ci
          npm run build

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact của Bản Build Demo
        uses: actions/upload-pages-artifact@v3
        with:
          # Đường dẫn tới thư mục chứa kết quả build của Vite trong demo
          path: './demo/dist'

      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
